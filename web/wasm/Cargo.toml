[package]
name = "buuz-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly wrapper around buuz-core for the Buuz website"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
buuz-core = { path = "../../core" }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
