<!--
  Buuz 2.0 desktop onboarding + settings mockups (static, not the app).
  Spec: docs/desktop-onboarding.md
  URL params: ?os=mac|win  &lang=mn|en  &screen=welcome|privacy|enable|enable-done|shortcut|try|harmony|import|done|home|typing|menu
  Without &screen it shows every screen as a gallery.
  Previews: node design/desktop-onboarding/render.js
-->
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buuz desktop onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
:root {
  --bg: #ffffff; --card: #fffaf1; --dough: #fff3e0; --fg: #1e1838; --muted: #6f5f55;
  --line: #f3e6d2; --press: #eedcc2; --sun: #ffd84d; --amber: #ffb648; --ember: #ff6a3d;
  --sun-press: #e9a52f; --accent: #2e6bff; --accent-press: #1638b8; --ok: #1f9d55; --blush: #ff8e8e;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: Nunito, system-ui, sans-serif; color: var(--fg); background: #efe6da; }
.gallery { display: flex; flex-wrap: wrap; gap: 28px; padding: 28px; }
.stage { width: 860px; height: 620px; display: grid; place-items: center; position: relative; overflow: hidden;
  background: radial-gradient(120% 90% at 20% 0%, #ffe3b8 0%, #ffc59a 35%, #e89a7a 70%, #8a6a9a 100%); }
.stage.win { background: radial-gradient(120% 90% at 80% 10%, #cfe0ff 0%, #9fb8ee 40%, #6b7fc4 75%, #3b3f7a 100%); }

/* ---------- window chrome ---------- */
.window { width: 760px; height: 540px; background: var(--bg); border-radius: 14px; position: relative; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 30px 60px rgba(40,20,10,.28); display: flex; flex-direction: column; }
.win .window { border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 24px 48px rgba(10,20,60,.35); }
.titlebar { height: 38px; flex: none; display: flex; align-items: center; padding: 0 14px; gap: 8px; }
.mac .titlebar .dot { width: 12px; height: 12px; border-radius: 50%; }
.mac .dot.r { background: #ff5f57; } .mac .dot.y { background: #febc2e; } .mac .dot.g { background: #d9d0c4; }
.win .titlebar { padding: 0 0 0 14px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #333; gap: 8px; }
.win .titlebar img { width: 16px; height: 16px; }
.win .titlebar .caps { margin-left: auto; display: flex; height: 100%; }
.win .titlebar .caps span { width: 46px; display: grid; place-items: center; font-size: 13px; color: #444; }
.win .titlebar .caps span:last-child:hover { background: #c42b1c; }
.lang { margin-left: auto; display: flex; gap: 2px; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: inset 0 0 0 1.5px var(--line); }
.win .lang { margin-left: 0; margin-right: 8px; }
.lang b { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; color: var(--muted); }
.lang b.on { background: var(--fg); color: #fff; }

/* ---------- onboarding layout ---------- */
.body { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 6px 56px 0; text-align: center; min-height: 0; }
.footer { height: 76px; flex: none; display: flex; align-items: center; padding: 0 28px; gap: 12px; }
.dots { display: flex; gap: 7px; margin: 0 auto; }
.dots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); }
.dots i.done { background: var(--amber); } .dots i.on { width: 26px; background: var(--ember); }
.btn { font: 800 15px Nunito, sans-serif; border-radius: 999px; padding: 11px 22px; background: var(--card); color: var(--fg); box-shadow: 0 4px 0 var(--press); white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 4px 0 var(--accent-press); }
.btn.ghost { background: none; box-shadow: none; color: var(--muted); }
.btn.big { font-size: 17px; padding: 14px 34px; }
.spacer { width: 120px; }
h1 { font-size: 30px; font-weight: 900; margin: 6px 0 6px; letter-spacing: -.01em; line-height: 1.15; }
.sub { color: var(--muted); font-size: 16px; font-weight: 700; margin: 0 0 18px; }
.mascot { width: 92px; height: 92px; border-radius: 26px; box-shadow: 0 6px 0 rgba(200,80,40,.25); }
.mascot.xl { width: 168px; height: 168px; border-radius: 44px; box-shadow: 0 10px 0 rgba(200,80,40,.25); }
.mascot.sm { width: 64px; height: 64px; border-radius: 18px; }
.card { background: var(--card); border-radius: 18px; box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--press); padding: 16px 18px; text-align: left; }
kbd, .key { font: 700 15px "JetBrains Mono", monospace; background: #fff; color: var(--fg); border-radius: 9px; padding: 5px 10px; box-shadow: inset 0 0 0 1.5px var(--line), 0 3px 0 var(--press); display: inline-flex; align-items: center; gap: 4px; min-width: 32px; justify-content: center; }
.key.lit { background: var(--sun); box-shadow: inset 0 0 0 1.5px var(--sun-press), 0 1px 0 var(--sun-press); transform: translateY(2px); }
.arrow { color: var(--muted); font-weight: 900; }
.cy { font-weight: 900; color: var(--ember); }

/* welcome */
.welcome .body { justify-content: center; padding-bottom: 8px; }
.steam { position: relative; }
.steam::before { content: none; position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font: 900 30px Nunito; color: var(--ember); opacity: .85; }
.welcome h1 { font-size: 40px; margin-top: 26px; }
.demo-line { display: flex; gap: 12px; align-items: center; justify-content: center; margin: 4px 0 12px; font-size: 20px; font-weight: 800; }
.demo-line .lat { font-family: "JetBrains Mono", monospace; font-size: 17px; color: var(--muted); background: var(--card); padding: 6px 12px; border-radius: 10px; box-shadow: inset 0 0 0 1.5px var(--line); }
.credit { font-size: 12px; color: var(--muted); font-weight: 700; margin-top: 14px; }
.platforms { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: var(--muted); background: var(--card); border-radius: 999px; padding: 5px 12px; box-shadow: inset 0 0 0 1.5px var(--line); }
.pill svg { width: 14px; height: 14px; }

/* privacy */
.promises { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 600px; }
.promise { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
.promise .ico { font-size: 28px; width: 40px; text-align: center; flex: none; }
.promise b { display: block; font-size: 15px; font-weight: 900; }
.promise span { font-size: 13px; color: var(--muted); font-weight: 700; }

/* enable */
.status { display: flex; align-items: center; gap: 14px; width: 100%; max-width: 520px; padding: 16px 18px; }
.status .name { font-size: 18px; font-weight: 900; }
.status .name small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
.badge { margin-left: auto; font-size: 13px; font-weight: 900; border-radius: 999px; padding: 6px 12px; }
.badge.wait { background: #fff0d6; color: #a0661a; }
.badge.ok { background: #dff5e7; color: var(--ok); }
.path { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; max-width: 600px; margin-top: 4px; }
.path .crumb { font-size: 13px; font-weight: 800; background: #fff; border-radius: 8px; padding: 5px 9px; box-shadow: inset 0 0 0 1.5px var(--line); }
.or { font-size: 13px; color: var(--muted); font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: var(--line); }
.note { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 12px; }

/* shortcut */
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; max-width: 620px; }
.choice { padding: 14px 12px 12px; text-align: center; position: relative; }
.choice.on { box-shadow: inset 0 0 0 3px var(--accent), 0 5px 0 var(--accent-press); background: #f3f7ff; }
.choice .keys { display: flex; gap: 6px; justify-content: center; align-items: center; height: 40px; }
.choice b { display: block; font-size: 13.5px; margin-top: 8px; font-weight: 900; }
.choice span { font-size: 12px; color: var(--muted); font-weight: 700; }
.rec { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--ember); color: #fff; font-size: 11px; font-weight: 900; border-radius: 99px; padding: 2px 9px; white-space: nowrap; }
.live { margin-top: 20px; display: flex; gap: 14px; align-items: center; padding: 12px 18px; }
.mode { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; padding: 6px 12px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
.mode.on { background: var(--fg); color: #fff; box-shadow: none; }
.mode img { width: 18px; height: 18px; border-radius: 5px; }

/* try */
.chat { width: 100%; max-width: 560px; background: #fff; border-radius: 18px; box-shadow: inset 0 0 0 2px var(--line), 0 5px 0 var(--press); overflow: hidden; text-align: left; }
.chat .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 2px solid var(--line); font-weight: 900; font-size: 14px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(160deg, #ffd1b8, #ff9e80); display: grid; place-items: center; font-size: 16px; }
.msgs { padding: 14px; display: flex; flex-direction: column; gap: 8px; height: 118px; }
.bubble { max-width: 70%; padding: 8px 12px; border-radius: 16px; font-size: 15px; font-weight: 700; }
.bubble.them { background: var(--dough); border-bottom-left-radius: 4px; align-self: flex-start; }
.bubble.me { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.compose { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-top: 2px solid var(--line); }
.field { flex: 1; background: var(--card); border-radius: 999px; padding: 9px 16px; font-size: 16px; font-weight: 700; box-shadow: inset 0 0 0 2px var(--accent); }
.field u { text-decoration-color: var(--ember); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.caret { display: inline-block; width: 2px; height: 18px; background: var(--fg); vertical-align: -3px; margin-left: 1px; }
.send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900; }
.tasks { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
.task { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 800; background: var(--card); border-radius: 999px; padding: 6px 14px 6px 8px; box-shadow: inset 0 0 0 1.5px var(--line); }
.task .ck { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
.task.done { color: var(--ok); } .task.done .ck { background: var(--ok); color: #fff; box-shadow: none; }
.task.now { box-shadow: inset 0 0 0 2px var(--amber); }
.task code { font: 700 13px "JetBrains Mono", monospace; color: var(--muted); }

/* harmony */
.tips { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 640px; }
.tip h3 { margin: 0 0 4px; font-size: 16px; font-weight: 900; }
.tip p { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 700; }
.ex { display: flex; align-items: center; gap: 8px; margin: 7px 0; font-size: 18px; }
.ex code { font: 700 14px "JetBrains Mono", monospace; color: var(--muted); min-width: 74px; }
.ex mark { background: var(--sun); color: var(--fg); border-radius: 4px; padding: 0 2px; }
.keymap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.keymap div { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 900; }

/* import */
.imports { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 600px; }
.imp { text-align: center; padding: 18px; }
.imp .big { font-size: 34px; }
.imp b { display: block; font-size: 16px; font-weight: 900; margin: 6px 0 4px; }
.imp span { display: block; font-size: 13px; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
.paste { font: 600 13px "JetBrains Mono", monospace; color: var(--muted); background: #fff; border-radius: 10px; padding: 9px 12px; box-shadow: inset 0 0 0 1.5px var(--line); text-align: left; }

/* done */
.done .body { justify-content: center; }
.confetti { position: absolute; inset: 38px 0 auto 0; height: 200px; pointer-events: none; }
.confetti i { position: absolute; width: 9px; height: 14px; border-radius: 3px; }
.recap { display: flex; gap: 12px; margin: 6px 0 4px; }
.recap .card { display: flex; gap: 8px; align-items: center; padding: 10px 14px; font-weight: 900; font-size: 14px; }
.pointer { position: absolute; top: 10px; right: 120px; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 900; color: var(--fg); background: var(--sun); padding: 6px 12px; border-radius: 999px; box-shadow: 0 3px 0 var(--sun-press); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: var(--muted); margin-top: 14px; }
.check i { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: #fff; font-style: normal; font-size: 13px; display: grid; place-items: center; }

/* ---------- settings window ---------- */
.settings .window { flex-direction: column; }
.split { flex: 1; display: flex; min-height: 0; }
.side { width: 196px; flex: none; background: var(--card); padding: 6px 10px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 2px solid var(--line); }
.side .brand { display: flex; align-items: center; gap: 8px; padding: 2px 8px 14px; font-weight: 900; font-size: 17px; }
.side .brand img { width: 28px; height: 28px; border-radius: 8px; }
.side .brand sup { color: var(--ember); font-size: 10px; }
.nav { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 14px; font-weight: 800; color: var(--muted); }
.nav .e { width: 20px; text-align: center; }
.nav.on { background: #fff; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line), 0 2px 0 var(--press); }
.side .grow { flex: 1; }
.main { flex: 1; padding: 6px 26px 18px; overflow: hidden; text-align: left; }
.main h2 { font-size: 24px; font-weight: 900; margin: 4px 0 14px; }
.hello { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.hello h2 { margin: 0; }
.hello span { color: var(--muted); font-weight: 700; font-size: 14px; }
.row3 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 12px; }
.mini h4 { margin: 0 0 8px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cheat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; }
.cheat div { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 900; }
.cheat kbd { font-size: 12px; padding: 3px 6px; min-width: 26px; border-radius: 7px; }
.trybox { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; font-weight: 700; color: var(--muted); }
.setting { display: flex; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 2px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .e { font-size: 22px; width: 30px; text-align: center; }
.setting b { display: block; font-size: 15px; font-weight: 900; }
.setting span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.setting .r { margin-left: auto; flex: none; }
.toggle { width: 44px; height: 26px; border-radius: 99px; background: var(--press); position: relative; display: block; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle.on { background: var(--accent); } .toggle.on::after { left: 21px; }
.soon { font-size: 11px; font-weight: 900; background: #fff0d6; color: #a0661a; border-radius: 99px; padding: 3px 8px; }
.group { padding: 0; margin-bottom: 12px; }

/* ---------- menu ---------- */
.menubar { position: absolute; top: 0; left: 0; right: 0; height: 30px; background: rgba(255,255,255,.55); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 14px; gap: 16px; font: 600 13px -apple-system, system-ui, sans-serif; color: #222; }
.menubar .r { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.menubar .im { background: rgba(0,0,0,.14); border-radius: 5px; padding: 2px 6px; display: inline-flex; align-items: center; }
.menubar .im svg { width: 16px; height: 16px; }
.dropdown { position: absolute; top: 34px; right: 128px; width: 290px; background: rgba(255,251,245,.94); backdrop-filter: blur(30px); border-radius: 12px; padding: 6px; box-shadow: 0 0 0 1px rgba(0,0,0,.1), 0 18px 40px rgba(40,20,10,.3); font-size: 14px; font-weight: 700; }
.mi { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 7px; }
.mi .e { width: 20px; text-align: center; }
.mi .k { margin-left: auto; color: var(--muted); font: 600 12px "JetBrains Mono", monospace; }
.mi.hi { background: var(--accent); color: #fff; } .mi.hi .k { color: #dfe7ff; }
.mi.head { gap: 10px; padding: 8px 10px 10px; }
.mi.head img { width: 34px; height: 34px; border-radius: 10px; }
.mi.head b { display: block; font-weight: 900; font-size: 15px; }
.mi.head span { font-size: 12px; color: var(--ok); font-weight: 800; }
.sep { height: 1.5px; background: rgba(0,0,0,.08); margin: 5px 8px; }
.mi.dim { color: #8d8279; font-size: 12px; font-weight: 800; padding: 4px 10px; }
.taskbar { position: absolute; bottom: 0; left: 0; right: 0; height: 44px; background: rgba(240,244,252,.8); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: flex-end; padding: 0 12px; gap: 12px; font: 600 12px "Segoe UI", system-ui, sans-serif; color: #222; }
.taskbar .ime { display: flex; flex-direction: column; align-items: center; line-height: 1.1; padding: 4px 8px; border-radius: 6px; background: rgba(0,0,0,.07); }
.taskbar .ime b { font-size: 12px; }
.win .dropdown { top: auto; bottom: 52px; right: 70px; border-radius: 8px; font-family: Nunito, "Segoe UI", sans-serif; }
.caption { position: absolute; left: 22px; bottom: 18px; color: #fff; font-weight: 900; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.35); max-width: 380px; text-align: left; }
.win .caption { bottom: 60px; }
</style>

<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
// URL params are untrusted: accept only known values.
const OS = P.get('os') === 'win' ? 'win' : 'mac';
const L = P.get('lang') === 'en' ? 'en' : 'mn';
const ALL = ['welcome', 'privacy', 'enable', 'enable-done', 'shortcut', 'try', 'harmony', 'import', 'done', 'home', 'typing', 'menu'];
const ONE = ALL.includes(P.get('screen')) ? P.get('screen') : null;
const ICON = '../../brand/icons/buuz-buddy-icon.svg';

const APPLE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 4.9c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>';
const WIN = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10 4.5v7H3zM11 4.4 21 3v8.5H11zM3 12.5h7v7L3 18.5zM11 12.5h10V21l-10-1.4z"/></svg>';
const GH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.4 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.7.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg>';

const mac = OS === 'mac';

const STEPS = ['welcome', 'privacy', 'enable', 'shortcut', 'try', 'harmony', 'import', 'done'];

function chrome(inner, opts = {}) {
  const lang = `<div class="lang"><b class="${L === 'mn' ? 'on' : ''}">МН</b><b class="${L === 'en' ? 'on' : ''}">EN</b></div>`;
  const tb = mac
    ? `<div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>${opts.noLang ? '' : lang}</div>`
    : `<div class="titlebar"><img src="${SMALL}">Buuz 2.0<span class="caps">${opts.noLang ? '' : lang}<span>─</span><span>▢</span><span>✕</span></span></div>`;
  return `<div class="window">${tb}${inner}</div>`;
}
function footer(step, nextLabel, opts = {}) {
  const i = STEPS.indexOf(step);
  const dots = STEPS.slice(1).map((s, k) => `<i class="${k + 1 === i ? 'on' : k + 1 < i ? 'done' : ''}"></i>`).join('');
  return `<div class="footer">${i > 1 ? `<span class="btn ghost">← ${T.back}</span>` : '<span class="spacer"></span>'}
    <div class="dots">${dots}</div>
    ${opts.skip ? `<span class="btn ghost">${T.skip}</span>` : ''}<span class="btn primary">${nextLabel} →</span></div>`;
}

  if (page === 0) {
    const ch = [['q', 'ө'], ['w', 'ү'], ['kh', 'х'], ['sh', 'ш'], ['ch', 'ч'], ['ya', 'я'], ['yu', 'ю'], ['ye', 'е'], ['ii', 'ий'], ['iii', 'ы'], ["'", 'ь'], ['"', 'ъ']];

    <div class="card mini"><h4>📖 ${T.cheat}</h4><div class="cheat">${ch.map(c => `<div><kbd>${c[0]}</kbd>${c[1]}</div>`).join('')}</div></div>`;
  } else {
    const rows = [T.s1, T.s2, T.s3, T.s4, T.s5, T.s6].map(s => `<div class="setting"><span class="e">${s[0]}</span><div><b>${s[1]}</b><span>${s[2]}</span></div>
      <span class="r">${s[3] === 'soon' ? `<span class="soon">${T.soon}</span>` : `<span class="toggle ${s[3] === 'on' ? 'on' : ''}"></span>`}</span></div>`).join('');
    main = `<h2>✍️ ${T.typingTitle}</h2><div class="card group">${rows}</div>`;
  }
  return chrome(`<div class="split">${side}<div class="main">${main}</div></div>`);
}
S.home = () => settings(0);
S.typing = () => settings(1);

S.menu = () => {
  const items = `<div class="mi head"><img src="${ICON}"><div><b>${T.mHead}</b><span>${T.mOn}</span></div></div><div class="sep"></div>
    <div class="mi hi"><span class="e">✓</span>${T.mMn}<span class="k">${mac ? '🌐' : '⊞ Space'}</span></div>
    <div class="mi"><span class="e"></span>${T.mLat}</div>
    <div class="mi"><span class="e">⏸️</span>${T.mOff}</div><div class="sep"></div>
    <div class="mi"><span class="e">📖</span>${T.mCheat}</div>
    <div class="mi"><span class="e">⚙️</span>${T.mSettings}<span class="k">${mac ? '⌘,' : ''}</span></div>
    <div class="mi"><span class="e">🔄</span>${T.mUpdate}</div>
    <div class="mi"><span class="e">💬</span>${T.mFeedback}</div>
    ${mac ? '' : `<div class="sep"></div><div class="mi"><span class="e">✕</span>${T.mQuit}</div>`}`;
  if (mac) return `<div class="menubar"><b></b><b>Finder</b><span>File</span><span>Edit</span><span>View</span>
      <div class="r"><span>🔋</span><span>📶</span><span class="im">${BGLYPH}</span><span>Tue 9:41</span></div></div>
      <div class="dropdown">${items}</div><div class="caption">${T.mCaption}</div>`;
  return `<div class="taskbar"><span>⌃</span><span>📶</span><span>🔊</span><span class="ime"><b>МОН</b><span>Б</span></span><span style="text-align:right;line-height:1.2">9:41<br>17.11.2026</span></div>
    <div class="dropdown">${items}</div><div class="caption">${T.mCaption}</div>`;
};

const list = ONE ? [ONE] : ALL;
document.documentElement.lang = L;
document.getElementById('root').innerHTML = (ONE ? '' : '<div class="gallery">') +
  list.map(s => `<div class="stage ${OS} ${s}" data-screen="${s}">${S[s]()}</div>`).join('') + (ONE ? '' : '</div>');
</script>
</body>
</html>
