<!doctype html>

<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buuz macOS app</title>
<style>
/* ---------- Page (outside the window) ---------- */
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  background: #E9E3DA; color: #1E1838; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.light { background: radial-gradient(120% 100% at 10% 0%, #F3D9C4 0%, #E7E1EF 55%, #DDE6F4 100%); }
body.dark { background: radial-gradient(120% 100% at 10% 0%, #2A1A22 0%, #121019 55%, #0B0D16 100%); color: #EEE; color-scheme: dark; }
.bar {
  position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: rgba(255,255,255,.72); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,.08);
}
body.dark .bar { background: rgba(20,18,28,.8); border-color: rgba(255,255,255,.08); }
.bar b { font-weight: 700; margin-right: 4px; }
.bar select, .bar button {
  font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid rgba(0,0,0,.15);
  background: #fff; color: #1E1838; cursor: pointer;
}
body.dark .bar select, body.dark .bar button { background: #241F31; color: #EEE; border-color: rgba(255,255,255,.15); }
.bar .seg { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0,0,0,.15); }
body.dark .bar .seg { border-color: rgba(255,255,255,.15); }
.bar .seg button { border: 0; border-radius: 0; }
.bar .seg button.on { background: #2E6BFF; color: #fff; }
.bar .sp { flex: 1; }
.bar .note { opacity: .6; font-size: 12px; }
.stage { padding: 28px 16px 60px; display: flex; justify-content: center; overflow-x: auto; }

/* ---------- Window tokens ---------- */
.win {
  --frame: #F4EFE8; --panel: #FFFFFF; --panel-line: #EAE2D7; --text: #1E1838; --text-2: #645D72; --text-3: #9A93A6;
  --fill: #F7F3EE; --fill-2: #EFE8DF; --hover: rgba(30,24,56,.05); --selected: rgba(30,24,56,.07);
  --sep: #EAE2D7; --accent: #2E6BFF; --accent-edge: #1D4FD1; --accent-soft: #EAF0FF;
  --ember: #FF6A3D; --amber: #FFB648; --success: #17915F; --success-bg: #E5F6EE; --warn: #A85400; --warn-bg: #FFF2DF;
  --danger: #D23B3B; --danger-bg: #FDECEC; --key-bg: #FFFFFF; --key-line: #D8CFC2; --key-edge: #CFC5B8;
  --btn2: #FFFFFF; --btn2-line: #E3DACE;
  --hero: #1E1838; --track: #E6DED3; --scrim: rgba(30,24,56,.30);
  --sheet-shadow: 0 24px 64px rgba(30,24,56,.28), 0 0 0 .5px rgba(30,24,56,.18);
  --win-shadow: 0 30px 80px rgba(30,24,56,.28), 0 0 0 .5px rgba(0,0,0,.25);
}
.win.dark {
  --frame: #121019; --panel: #1B1825; --panel-line: rgba(255,255,255,.07); --text: #F3F0F9; --text-2: #A8A2B7; --text-3: #6F6981;
  --fill: #221E2E; --fill-2: #2B2639; --hover: rgba(255,255,255,.05); --selected: rgba(255,255,255,.08);
  --sep: rgba(255,255,255,.07); --accent: #4D82FF; --accent-edge: #2D5FD6; --accent-soft: rgba(77,130,255,.15);
  --success: #43D196; --success-bg: rgba(67,209,150,.12); --warn: #FFC266; --warn-bg: rgba(255,182,72,.11);
  --danger: #FF7B7B; --danger-bg: rgba(255,123,123,.12);
  --key-bg: #2A2537; --key-line: #3B3550; --key-edge: #15121D;
  --btn2: #2E2940; --btn2-line: transparent;
  --hero: #0D0B14; --track: #2E2940; --scrim: rgba(0,0,0,.55);
  --sheet-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.14);
  --win-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 .5px rgba(255,255,255,.18);
}

/* ---------- Window frame ---------- */
.win {
  position: relative; width: 1000px; height: 680px; min-width: 880px; min-height: 600px; max-width: 1600px;
  resize: both; overflow: hidden; border-radius: 12px; background: var(--frame); color: var(--text);
  box-shadow: var(--win-shadow); display: grid; grid-template-columns: 200px minmax(0, 1fr);
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
.round { font-family: ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.lights { position: absolute; top: 16px; left: 18px; display: flex; gap: 8px; z-index: 5; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.topicons { position: absolute; top: 7px; right: 12px; display: flex; gap: 2px; z-index: 5; align-items: center; }
.ibtn {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--text-2);
  background: transparent; border: 0; cursor: pointer; position: relative; flex: none;
}
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn svg { width: 17px; height: 17px; }
.ibtn .badge { position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 0 2px var(--frame); }
.ibtn.lang { width: auto; padding: 0 9px; font-weight: 700; font-size: 11.5px; letter-spacing: .02em; }
.ibtn.lang span { border: 1.5px solid currentColor; border-radius: 999px; padding: 1px 6px; }
.sidebtn { position: absolute; top: 7px; left: 84px; z-index: 5; }

/* ---------- Sidebar ---------- */
.side { padding: 48px 8px 12px 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.logo { display: flex; align-items: center; gap: 8px; padding: 2px 10px 16px; }
.logo img { width: 26px; height: 26px; border-radius: 7px; }
.logo b { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.logo small { font-size: 10.5px; font-weight: 700; color: var(--text-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 8px;
  color: var(--text); text-decoration: none; font-size: 13.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.nav a svg { width: 16px; height: 16px; color: var(--text-2); flex: none; }
.nav a:hover { background: var(--hover); }
.nav a.on { background: var(--selected); font-weight: 600; }
.nav a.on svg { color: var(--text); }
.side .grow { flex: 1; min-height: 12px; }
.side .rule { height: 1px; background: var(--sep); margin: 8px 10px; flex: none; }

/* compact setup card (collapsible) */
.setup { background: var(--panel); border-radius: 12px; padding: 12px 12px 6px; flex: none; }
.win.dark .setup { background: var(--fill); }
.setup .hd { display: flex; align-items: center; gap: 6px; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  font: 700 12.5px/1.2 -apple-system, sans-serif; color: var(--text); text-align: left; }
.setup .hd .n { margin-left: auto; color: var(--text-3); font-weight: 600; }
.setup .hd svg { width: 13px; height: 13px; color: var(--text-3); transition: transform .15s; }
.setup.closed { padding-bottom: 12px; }
.setup.closed .hd svg { transform: rotate(-90deg); }
.setup.closed .rows { display: none; }
.progress { height: 4px; background: var(--track); border-radius: 999px; margin: 10px 0 4px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.citem { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 2px; font-size: 12.5px; color: var(--text); white-space: nowrap; cursor: pointer; border-radius: 6px; min-width: 0; }
.citem .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.citem .c { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--text-3); flex: none; display: grid; place-items: center; }
.citem.done { color: var(--text-2); }
.citem.done .c { background: var(--success); border-color: var(--success); color: #fff; }
.citem.done .c svg { width: 9px; height: 9px; stroke-width: 3.4; }
.citem.now .c { border-color: var(--accent); box-shadow: inset 0 0 0 2.5px var(--panel), inset 0 0 0 7px var(--accent); }
.win.dark .setup .citem.now .c { box-shadow: inset 0 0 0 2.5px var(--fill), inset 0 0 0 7px var(--accent); }
.citem .go { margin-left: auto; color: var(--text-3); font-weight: 600; font-size: 11.5px; }

/* ---------- Content panel: ONE scroll view, ONE centred column ---------- */
.panel {
  margin: 44px 12px 12px 0; background: var(--panel); border-radius: 14px; box-shadow: 0 0 0 1px var(--panel-line);
  min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; position: relative;
}
.scroll { flex: 1; overflow: auto; padding: 40px max(48px, 9%) 56px; container-type: inline-size; }
.scroll::-webkit-scrollbar { width: 10px; } .scroll::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 10px; border: 3px solid var(--panel); }
.col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.ph > div { min-width: 0; }
.ph h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
.ph p { margin: 6px 0 0; color: var(--text-2); font-size: 13.5px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sh { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 22px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.sh .ibtn { width: 28px; height: 28px; margin: -4px -6px -4px 0; }
.sh .ibtn svg { width: 15px; height: 15px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }

/* ---------- Common bits ---------- */
.card { background: var(--fill); border-radius: 12px; }
.pad { padding: 20px; }
.group { background: var(--fill); border-radius: 12px; padding: 0 20px; }
.srow { display: flex; align-items: center; gap: 16px; min-height: 60px; padding: 12px 0; border-top: 1px solid var(--sep); }
.srow:first-child { border-top: 0; }
.srow .t { flex: 1; min-width: 0; }
.srow .t > b { display: block; font-weight: 600; font-size: 13.5px; }
.srow .t > span { display: block; color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
.srow .t .ok { color: var(--success); font-weight: 600; }
.srow .t .path { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow > :not(.t) { flex: none; }
.srow.soon { opacity: .55; }
.btn {
  font: 600 13px/1 -apple-system, sans-serif; height: 32px; padding: 0 14px; border-radius: 8px; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--text);
}
.btn.primary { background: var(--accent); color: #fff; box-shadow: 0 2px 0 var(--accent-edge); }
.btn.primary:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--accent-edge); }
.btn.primary[disabled] { background: var(--fill-2); color: var(--text-3); box-shadow: none; cursor: default; }
.btn.secondary { background: var(--btn2); box-shadow: inset 0 0 0 1px var(--btn2-line); }
.btn.ghost { background: transparent; color: var(--text-2); padding: 0 10px; }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.big { height: 38px; padding: 0 18px; font-size: 14px; }
.btn svg { width: 14px; height: 14px; }
.link { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
kbd {
  display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px;
  font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text); background: var(--key-bg);
  border: 1px solid var(--key-line); border-bottom-width: 2.5px; border-bottom-color: var(--key-edge); border-radius: 6px; vertical-align: middle; white-space: nowrap;
}
kbd.big { height: 32px; min-width: 32px; font-size: 14px; padding: 0 10px; border-radius: 8px; }
kbd.lit { background: var(--accent); color: #fff; border-color: var(--accent-edge); }
.keys { display: inline-flex; gap: 4px; align-items: center; }
.latin { font: 600 13.5px ui-monospace, "SF Mono", Menlo, monospace; background: var(--fill-2); padding: 3px 8px; border-radius: 6px; color: var(--text); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--fill-2); color: var(--text-2); white-space: nowrap; vertical-align: 1px; }
.pill.blue { background: var(--accent-soft); color: var(--accent); }
.pill.green { background: var(--success-bg); color: var(--success); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.kb-chip {
  display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px;
  font-weight: 600; font-size: 12.5px; background: var(--fill-2); color: var(--text); white-space: nowrap; flex: none;
}
.kb-chip .glyph { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font: 800 11px/1 ui-rounded, sans-serif; background: var(--text-3); color: var(--panel); }
.kb-chip.buuz .glyph { background: var(--ember); color: #fff; }
.kb-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2s infinite; }
.kb-chip.other .dot { background: var(--warn); }
@keyframes pulse { 50% { opacity: .4; } }
.switch { width: 36px; height: 20px; border-radius: 999px; background: var(--track); position: relative; flex: none; cursor: pointer; transition: .15s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: .15s; }
.switch.on { background: var(--accent); }
.switch.on::after { left: 18px; }
.switch.dim { opacity: .45; }
.seg2 { display: inline-flex; background: var(--fill-2); border-radius: 8px; padding: 2px; gap: 2px; flex: none; }
.group .seg2, .card .seg2 { background: var(--track); }
.seg2 button { font: 600 12.5px -apple-system, sans-serif; border: 0; background: transparent; color: var(--text-2); height: 26px; padding: 0 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.seg2 button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Banner: icon, text column, optional small trailing item (.act) or a button row under the text (.acts) */
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
.banner > svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.banner .bt { flex: 1; min-width: 0; color: var(--text); }
.banner .bt b { display: block; font-size: 13.5px; margin-bottom: 2px; }
.banner .act { flex: none; align-self: center; display: flex; gap: 8px; align-items: center; }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.banner.neutral { background: var(--fill); color: var(--text-2); }
.banner.info { background: var(--accent-soft); color: var(--accent); }
.banner.ok { background: var(--success-bg); color: var(--success); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.danger { background: var(--danger-bg); color: var(--danger); }
.banner.info .bt b, .banner.ok .bt b, .banner.warn .bt b, .banner.danger .bt b { color: inherit; }
.banner.info .bt b { color: var(--accent); } .banner.ok .bt b { color: var(--success); } .banner.warn .bt b { color: var(--warn); } .banner.danger .bt b { color: var(--danger); }

/* ---------- Home ---------- */
.hero {
  position: relative; border-radius: 14px; overflow: hidden; color: #fff; height: 152px; padding: 0 28px;
  background:
    radial-gradient(70% 120% at 88% 20%, rgba(255,106,61,.7), transparent 60%),
    radial-gradient(60% 90% at 70% 110%, rgba(255,182,72,.5), transparent 60%),
    var(--hero);
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
}
.hero.warnhero { background: radial-gradient(70% 120% at 88% 20%, rgba(255,182,72,.65), transparent 60%), radial-gradient(60% 90% at 70% 110%, rgba(255,106,61,.45), transparent 60%), var(--hero); }
.hero h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; max-width: calc(100% - 150px); }
.hero p { margin: 6px 0 16px; color: rgba(255,255,255,.78); font-size: 13.5px; max-width: calc(100% - 150px); }
.hero img { position: absolute; right: 22px; bottom: -16px; width: 122px; transform: rotate(-6deg); filter: drop-shadow(0 10px 20px rgba(0,0,0,.35)); }
.hero .x { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; border: 0; cursor: pointer; z-index: 1; }
.hero .x svg { width: 12px; height: 12px; }
.hero .btn.primary { box-shadow: 0 2px 0 #1A3FA8; }
@container (max-width: 500px) { .hero img { display: none; } .hero h2, .hero p { max-width: 100%; } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: -12px; }
.stile { background: var(--fill); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; color: inherit; text-decoration: none; }
.stile:hover { background: var(--fill-2); }
.stile .v { font: 700 17px/1.3 ui-rounded, "SF Pro Rounded", -apple-system, sans-serif; display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; }
.stile .l { color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stile .glyph { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font: 800 13px/1 ui-rounded, sans-serif; background: var(--ember); color: #fff; flex: none; }
.stile .glyph.off { background: var(--text-3); }
.tryfield {
  display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 12px;
  background: var(--fill); border: 1.5px solid transparent; font-size: 17px;
}
.tryfield.focus { border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 4px var(--accent-soft); }
.tryfield .txt { flex: 1; white-space: nowrap; overflow: hidden; }
.ph2 { color: var(--text-3); }
.caret { display: inline-block; width: 2px; height: 1.15em; background: var(--accent); vertical-align: -3px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
u.pre { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--text-2); }
.lrow { display: grid; grid-template-columns: 64px auto minmax(0, 1fr); gap: 16px; align-items: center; min-height: 52px; padding: 10px 0; border-top: 1px solid var(--sep); }
.lrow:first-child { border-top: 0; }
.lrow .ex { font-size: 14px; white-space: nowrap; }
.lrow .ex .arrow { color: var(--text-3); margin: 0 6px; }
.lrow .ex b { font-weight: 650; }
.lrow .desc { color: var(--text-2); font-size: 12.5px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@container (max-width: 470px) { .lrow { grid-template-columns: 64px 1fr; } .lrow .desc { display: none; } }

/* ---------- Settings sheet ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 20; }
.sheet {
  position: absolute; z-index: 21; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(760px, calc(100% - 64px)); height: min(560px, calc(100% - 56px));
  background: var(--panel); border-radius: 14px; box-shadow: var(--sheet-shadow);
  display: grid; grid-template-columns: 184px minmax(0, 1fr); overflow: hidden;
}
.sheet .snav { background: var(--frame); padding: 20px 10px 14px; display: flex; flex-direction: column; gap: 2px; min-height: 0; }
.sheet .snav .eyebrow { padding: 0 10px 10px; }
.sheet .snav .ver { margin-top: auto; padding: 0 10px; color: var(--text-3); font-size: 12px; }
.sheet .sbody { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.sheet .sbody > .close { position: absolute; top: 12px; right: 12px; z-index: 2; }
.sheet .scroll { padding: 32px 36px 40px; }
.sheet .col { max-width: none; gap: 28px; }
.sheet .ph h1 { font-size: 22px; }

/* hotkey options: full-width radio rows */
.opts { background: var(--fill); border-radius: 12px; padding: 0 20px; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 0; border-top: 1px solid var(--sep); cursor: pointer; }
.opt:first-child { border-top: 0; }
.opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--text-3); flex: none; background: var(--panel); }
.opt.on .radio { border: 5.5px solid var(--accent); }
.opt .t { flex: 1; min-width: 0; }
.opt .t b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; flex-wrap: wrap; }
.opt .t .n { display: block; color: var(--text-2); font-size: 12.5px; margin-top: 2px; }
.opt .keys { flex: none; }
.recorder {

.welcome h1 { font-size: 34px; font-weight: 800; margin: 4px 0 0; line-height: 1.12; letter-spacing: -.015em; white-space: pre-line; }
.welcome p { color: var(--text-2); font-size: 15px; margin: 0; }
.demo { display: inline-flex; align-items: center; gap: 12px; padding: 12px 18px; border-radius: 12px; background: var(--fill); font-size: 18px; }
.demo .out { font-weight: 700; overflow: hidden; white-space: nowrap; border-right: 2px solid var(--accent); animation: type 3.2s steps(13) infinite; width: 13ch; }

.tick { width: 48px; height: 48px; border-radius: 50%; background: var(--success); color: #fff; display: grid; place-items: center; animation: pop .4s ease-out; align-self: center; }

.kbtile.on { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); color: var(--text); }

.why { margin: -10px 0 0; text-align: center; color: var(--text-3); font-size: 12.5px; }
.field { min-height: 84px; padding: 14px 22px; border-radius: 14px; border: 1.5px solid var(--sep); background: var(--panel); display: flex; align-items: center; font-size: 26px; letter-spacing: -.005em; }
.field.focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.field.ok { border-color: var(--success); box-shadow: 0 0 0 4px var(--success-bg); }
.field.warn { border-color: var(--warn); box-shadow: 0 0 0 4px var(--warn-bg); }
.ftools { display: flex; align-items: center; gap: 8px; margin-top: -8px; flex-wrap: wrap; }
.ftools .sp { flex: 1; }
.subcheck { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap; }

.subcheck.done .c { background: var(--success); border-color: var(--success); color: #fff; }
.subcheck.done .c svg { width: 9px; height: 9px; stroke-width: 3.4; }
.diff b { color: var(--danger); text-decoration: underline; }
/* short windows: the tutorial body tightens before it scrolls */
.tour .body { container-type: size; }
@container (max-height: 570px) {

  .why { margin-top: -8px; }
  .ftools { margin-top: -6px; }
  .welcome img { width: 96px; }
}
.hop { width: 36px; animation: hop 1.2s ease-in-out 2; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden;  z-index: 0; }
.tour .body, .tour .foot { position: relative; z-index: 1; }

@keyframes fall { to { transform: translateY(720px) rotate(540deg); } }

svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

html.shot .bar { display: none; }
html.shot .stage { padding: 0; }
html.shot .win { border-radius: 0; box-shadow: none; }

// ---- Tour rail ----
const TOUR_IDS = ["t-welcome", "t-privacy", "t-add", "t-key", "t-switch", "t-l1", "t-l2", "t-l3", "t-l4", "t-l5", "t-l6", "t-l7", "t-l8", "t-done"];
function tourRail(cur) {
  const idx = TOUR_IDS.indexOf(cur);
  const row = (id, label, small) => {
    const i = TOUR_IDS.indexOf(id);
    const st = i < idx ? "done" : i === idx ? "now" : "";
    return `<div class="citem ${st} ${small ? "small" : ""}" data-go="${id}"><span class="c">${st === "done" ? I("check") : ""}</span><span class="lbl">${label}</span></div>`;
  };
  const setup = ["welcome", "privacy", "add", "key", "switch"].map(s => row("t-" + s, t("tour.step." + s))).join("");
  const lessons = LESSONS.map(l => row("t-l" + l.n, t("lesson" + l.n + ".title"), true)).join("");
  return `<aside class="side rail">
    <div class="logo"><img src="${BUDDY_S}" alt=""><b class="round">Buuz</b><small>2.0</small></div>
    <h5 class="eyebrow">${t("tour.setup")}</h5>${setup}

// ---- Home ----
function home(state) {
  const h = new Date().getHours();
  const greet = t(h < 12 ? "home.greeting.morning" : h < 18 ? "home.greeting.afternoon" : "home.greeting.evening");
  const off = state === "off", done = state === "done";
  const x = `<button class="x" aria-label="${t("common.close")}">${I("x")}</button>`;
  let hero;
  if (off) hero = `<div class="hero warnhero"><h2 class="round">${t("home.hero.off.title")}</h2><p>${t("home.hero.off.body")}</p><button class="btn primary big">${t("enable.button")}</button><img src="${BUDDY}" alt=""></div>`;
  else if (done) hero = `<div class="hero">${x}<h2 class="round">${t("home.hero.tip.title")}</h2><p>${t("home.hero.tip.body")}</p><button class="btn primary big">${t("home.hero.tip.button")} ${I("arrow")}</button><img src="${BUDDY}" alt=""></div>`;
  else hero = `<div class="hero">${x}<h2 class="round">${t("home.hero.lessons.title")}</h2><p>${t("home.hero.lessons.body")}</p><button class="btn primary big" data-go="t-l6">${I("play")} ${t("home.hero.lessons.continue", { done: 5, total: 8 })}</button><img src="${BUDDY}" alt=""></div>`;
  const stats = `<div class="stats">
    <a class="stile" data-go="shortcuts"><span class="v">${off ? `<span class="glyph off">A</span>ABC` : `<span class="glyph">Б</span>Buuz`}</span><span class="l">${t("home.card.keyboard")}</span></a>
    <a class="stile" data-go="shortcuts"><span class="v">🌐 fn</span><span class="l">${t("home.card.switchKey")}</span></a>
    <a class="stile" data-go="typing"><span class="v">${t("typing.mode.smart")}</span><span class="l">${t("home.card.mode")}</span></a>
  </div>`;
  const rows = [
    [k("q"), "qndqr", "өндөр", "cheat.q"],
    [k("w"), "wg", "үг", "cheat.w"],
    [k("'"), "mor'", "морь", "cheat.soft"],
    [k('"'), '"', "ъ", "cheat.hard"],
    [k("o") + k("u"), "eruul", "эрүүл", "cheat.harmony"],
    [k("v") + k("v"), "svv", "сүү", "cheat.vv"],
    [k("t") + k("s"), "tsai", "цай", "cheat.ts"],
    [k("z") + k("h"), "zhims", "жимс", "cheat.zh"],
    [k("esc"), "zoom ⎋", "zoom", "cheat.esc"],
    [k("⌫"), "tov ␣ ⌫", "тов", "cheat.backspace"],
    [k("b") + k("n"), "bn", "байна", "cheat.abbr"]
  ].map(([keys, lat, cyr, d]) => `<div class="lrow"><span class="keys">${keys}</span><span class="ex"><span class="latin">${lat}</span><span class="arrow">→</span><b>${cyr}</b></span><span class="desc">${t(d)}</span></div>`).join("");
  return page(`
    ${ph(greet + " 👋", t("home.subtitle"))}
    ${hero}
    ${stats}
    <section class="sec">
      <div class="sh">${t("home.try.title")}${chip(!off)}</div>
      <div class="tryfield ${off ? "" : "focus"}"><span class="txt">${off ? `<span class="ph2">${t("home.try.placeholder")}</span>` : `сайн байна уу, <u class="pre">найз</u>${caret}`}</span></div>
    </section>
    <section class="sec">
      <div class="sh">${t("home.cheat.title")}<button class="ibtn" title="${t("home.cheat.find")}" aria-label="${t("home.cheat.find")}">${I("search")}</button></div>
      <div class="group">${rows}</div>

}

  const soon = key => `<div class="srow soon"><div class="t"><b>${noEmoji(t(key))}</b><span>${t(key + ".hint")}</span></div><span class="pill">${t("common.comingSoon")}</span></div>`;
  const prev = [["eruul", "эрүүл", "эруул"], ["svv", "сүү", "свв"], ["tsai", "цай", "тсай"], ["bn", "байна", "бн"], ["zoom ⎋", "zoom", "зоом"]]
    .map(([l, smart, cl]) => `<div class="prow"><span class="mono">${l}</span><b>${classic ? cl : smart}</b></div>`).join("");
  const sec = (title, body) => `<section class="sec"><div class="sh">${title}</div><div class="group">${body}</div></section>`;
  return `${ph(t("settings.typing.title"), t("typing.subtitle"))}
    <div class="sec">
      <div class="group"><div class="srow"><div class="t"><b>${t("typing.mode")}</b><span>${t("typing.mode.hint")}</span></div>

      ${classic ? `<div class="banner info">${I("info")}<span class="bt">${t("typing.classicNote")}</span></div>` : ""}
    </div>

    ${sec(t("typing.group.keys"), row("typing.doubleV", true) + row("typing.habitKeys", true) + row("typing.abbreviations", true))}
    ${sec(t("typing.group.latin"), row("typing.keepLatin", true) + row("typing.autoLatin", true))}
    <section class="sec"><div class="sh">${t("typing.preview")}</div><p class="hint">${t("typing.preview.hint")}</p><div class="group">${prev}</div></section>

// ---- Hotkey options (shared by the Shortcuts page and tutorial step 4) ----
function hotkeyOptions(state) {
  const custom = ["recording", "conflict", "saved", "custom"].includes(state);
  const opt = (on, title, note, keys, pill) => `<div class="opt ${on ? "on" : ""}" role="radio" aria-checked="${on}"><span class="radio"></span><div class="t"><b>${title}${pill || ""}</b><span class="n">${note}</span></div><span class="keys">${keys}</span></div>`;
  let rec = "";
  if (custom) {
    if (state === "recording") rec = `<div class="recorder rec"><span class="recdot"></span><span class="t">${t("hotkey.recording")}</span>${k("⌃", "big lit")}${k("⇧", "big lit")}<button class="btn ghost">${t("hotkey.clear")}</button></div><p class="hint">${t("hotkey.needsModifier")}</p>`;
    if (state === "conflict") rec = `<div class="banner warn">${I("warn")}<div class="bt"><b>${t("hotkey.conflict.title", { keys: "⌃ Space" })}</b>${t("hotkey.conflict.body", { action: t("hotkey.action.prevSource") })}
        <div class="acts"><button class="btn primary">${t("hotkey.conflict.another")}</button><button class="btn secondary">${t("hotkey.conflict.useAnyway")}</button></div></div></div>`;
    if (state === "saved" || state === "custom") rec = `<div class="recorder set">${k("⌃", "big")}${k("⇧", "big")}${k("Space", "big")}<span class="t">${I("check")} ${t("hotkey.saved")}</span><button class="btn ghost">${t("hotkey.clear")}</button></div>`;
  } else {
    rec = `<div class="banner neutral">${I("info")}<div class="bt">${t("hotkey.system")}<div class="acts"><button class="btn secondary">${t("shortcut.manual.button")}</button></div></div></div>`;
  }
  const customKeys = custom && state !== "recording" ? (state === "conflict" ? k("⌃") + k("Space") : k("⌃") + k("⇧") + k("Space")) : "";
  return `<div class="opts" role="radiogroup" aria-label="${t("settings.shortcuts.switchKey")}">
    ${opt(!custom, t("hotkey.fn"), t("hotkey.fn.note"), FN(), ` <span class="pill blue">${t("common.recommended")}</span>`)}
    ${opt(false, "Control + Space", t("hotkey.controlSpace.note"), k("⌃") + k("Space"))}
    ${opt(false, "Caps Lock", t("hotkey.capsLock.note"), k("⇪ caps"))}
    ${opt(custom, t("hotkey.custom"), custom ? t("hotkey.custom.note") : t("hotkey.record"), customKeys)}
  </div>${rec}`;
}

function foot(opts) {

function tLesson(n, state) {
  const L = LESSONS[n - 1];
  const keyHtml = L.keys.map(x => /^[⏎␣⌫]|^esc$/.test(x) ? k(x) : `<span class="latin">${x}</span>`).join("");
  let field, banner, fcls = "focus", chipOn = true;
  const phd = `<span class="ph2">${t("lesson.field")}…</span>`;
  if (state === "waiting") {
    field = L.typed[0] + (L.typed[1] ? `<u class="pre">${L.typed[1]}</u>` : "") + caret;
    if (n === 1) field = phd + caret;
    banner = `<div class="banner neutral">${I("info")}<span class="bt">${t("lesson.waiting")}</span></div>`;
  } else if (state === "wrong") {
    chipOn = false; fcls = "warn";
    field = `<span class="mono" style="font-size:22px">${L.latin.slice(0, Math.max(3, L.latin.length - 3))}</span>${caret}`;
    banner = `<div class="banner warn">${I("warn")}<span class="bt"><b>${t("lesson.wrong.title", { name: "ABC" })}</b>${t("lesson.wrong.body", { key: "🌐 fn" })}</span><span class="act">${FN()}</span></div>`;
  } else if (state === "latin") {
    fcls = "warn";
    field = `<span class="mono" style="font-size:22px">${L.latin}</span>${caret}`;
    banner = `<div class="banner info">${I("info")}<span class="bt"><b>${t("lesson.latin.title")}</b>${t("lesson.latin.body")}</span></div>`;
  } else if (state === "close") {
    if (L.closeOwn) {
      field = L.closeField[0] + (L.closeField[1] ? `<u class="pre">${L.closeField[1]}</u>` : "") + caret;
      banner = `<div class="banner info">${I("bulb")}<span class="bt"><b>${t("lesson.close.title")}</b>${t(L.closeOwn)}</span></div>`;
    } else {
      field = `<span class="diff">${L.close}</span>${caret}`;
      banner = `<div class="banner info">${I("bulb")}<span class="bt"><b>${t("lesson.close.title")}</b>${t("lesson.close.body", { got: L.closeTxt })}</span></div>`;
    }
  } else if (state === "success") {
    fcls = "ok";
    field = L.out + (n === 5 ? "" : caret);
    banner = `<div class="banner ok">${I("check", 'style="stroke-width:2.6"')}<span class="bt"><b>${t("lesson.success")}</b>${t("lesson" + n + ".success")}</span><span class="act"><img class="hop" src="${BUDDY_S}" alt=""></span></div>`;
  } else if (state === "off") {
    field = phd; fcls = "";
    banner = `<div class="banner warn">${I("warn")}<span class="bt">${t("lesson8.off")}</span><span class="act"><button class="btn secondary">${t("lesson8.turnOn")}</button></span></div>`;
  }
  let steps = "";
  if (L.steps) {
    const s1 = state === "success" || state === "close", s2 = state === "success";
    steps = L.steps.map((s, i) => { const d = i === 0 ? s1 : s2; return `<span class="subcheck ${d ? "done" : ""}"><span class="c">${d ? I("check") : ""}</span>${t(s)}</span>`; }).join("");
  }
  return tour(`
    ${head(t("tour.lessonEyebrow", { n, total: 8 }), t("lesson" + n + ".title"), t("lesson" + n + ".body"))}
    <div class="task" aria-label="${t("lesson.type")}"><span class="keys">${keyHtml}</span><span class="arrow">${I("arrow")}</span><span class="out">${L.out}</span></div>
    <p class="why">${t("lesson" + n + ".why")}</p>
    <div class="field ${fcls}" role="textbox" aria-label="${t("lesson.field")}">${field}</div>
    <div class="ftools">${chip(chipOn)}${steps}<span class="sp"></span><button class="btn ghost">${t("lesson.clear")}</button></div>
    ${banner}`, foot({ primary: n === 8 ? t("lesson.finish") : t("lesson.next") + " →", disabled: state !== "success", n: t("tour.lessonEyebrow", { n, total: 8 }) }));
}
function tDone() {
  const colors = ["#FF6A3D", "#FFB648", "#2E6BFF", "#FF8E8E", "#43D196", "#7A5AF8"];
  let conf = "";
  for (let i = 0; i < 46; i++) conf += `<i style="left:${(i * 37) % 100}%;background:${colors[i % 6]};animation-delay:${-(i * 0.29) % 3.4}s;animation-duration:${2.8 + (i % 5) * 0.35}s;transform:rotate(${i * 23}deg)"></i>`;

}

let THEME = "light";
const win = document.getElementById("win");
const screenSel = document.getElementById("screen"), stateSel = document.getElementById("state");
let groups = {};
SCREENS.forEach(s => (groups[s.group] = groups[s.group] || []).push(s));
screenSel.innerHTML = Object.entries(groups).map(([g, list]) => `<optgroup label="${g}">${list.map(s => `<option value="${s.id}">${s.label}</option>`).join("")}</optgroup>`).join("");

function parse() {
  const [id, st] = location.hash.slice(1).split("/");
  const scr = SCREENS.find(s => s.id === id) || SCREENS[0];
  return { scr, st: scr.states.includes(st) ? st : scr.states[0] };
}
function render() {
  const { scr, st } = parse();
  screenSel.value = scr.id;
  stateSel.innerHTML = scr.states.map(s => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("");
  stateSel.disabled = scr.states.length < 2;
  document.documentElement.lang = LANG;
  win.className = "win " + THEME;
  document.body.className = THEME;
  let side, main, over = "";
  if (scr.id.startsWith("t-")) {
    side = tourRail(scr.id);
    const m = scr.id.match(/^t-l(\d)$/);
    main = m ? tLesson(+m[1], st) : { "t-welcome": tWelcome, "t-privacy": tPrivacy, "t-add": tAdd, "t-key": tKey, "t-switch": tSwitch, "t-done": tDone }[scr.id](st);
  } else if (SHEET.includes(scr.id)) {
    side = appSidebar("settings", false);
    main = home("setup");
    over = sheet(scr.id, { general, typing, shortcuts, privacy, about }[scr.id](st));
  } else {
    side = appSidebar(scr.id, scr.id === "home" && st === "done");
    main = { home, lessons, help }[scr.id](st);
  }
  win.innerHTML = `
    <div class="lights"><i></i><i></i><i></i></div>
    <button class="ibtn sidebtn" title="Sidebar">${I("sidebar")}</button>
    <div class="topicons">
      <button class="ibtn" data-act="theme" title="${t("top.theme")}">${I(THEME === "dark" ? "moon" : "sun")}</button>
      <button class="ibtn" title="${t("top.whatsNew")}">${I("bell")}<span class="badge"></span></button>
      <button class="ibtn lang" data-act="lang" title="${t("top.language")}"><span>${LANG === "mn" ? "МН" : "EN"}</span></button>
    </div>
    ${side}
    <main class="panel">${main}</main>
    ${over}`;
  [...document.querySelectorAll("#themeSeg button")].forEach(b => b.classList.toggle("on", b.dataset.v === THEME));
  [...document.querySelectorAll("#langSeg button")].forEach(b => b.classList.toggle("on", b.dataset.v === LANG));
}
function go(id, st) { location.hash = id + (st ? "/" + st : ""); }
screenSel.onchange = () => go(screenSel.value);
stateSel.onchange = () => go(screenSel.value, stateSel.value);
document.getElementById("themeSeg").onclick = e => { if (e.target.dataset.v) { THEME = e.target.dataset.v; save(); render(); } };
document.getElementById("langSeg").onclick = e => { if (e.target.dataset.v) { LANG = e.target.dataset.v; save(); render(); } };
document.getElementById("sizeSeg").onclick = e => { const v = e.target.dataset.v; if (!v) return; const [w, h] = v.split("x"); win.style.width = w + "px"; win.style.height = h + "px"; };
win.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    if (a.dataset.act === "theme") THEME = THEME === "dark" ? "light" : "dark";
    if (a.dataset.act === "lang") LANG = LANG === "mn" ? "en" : "mn";
    if (a.dataset.act === "setup") SETUP_OPEN = !SETUP_OPEN;
    save(); return render();
  }
  const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "Escape" && SHEET.includes(parse().scr.id)) return go("home");
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const flat = []; SCREENS.forEach(s => s.states.forEach(st => flat.push([s.id, st])));
  const { scr, st } = parse();
  let i = flat.findIndex(([a, b]) => a === scr.id && b === st);
  i = (i + (e.key === "ArrowRight" ? 1 : -1) + flat.length) % flat.length;
  go(flat[i][0], flat[i][1]);
});
function save() { try { localStorage.setItem("buuz-mock", JSON.stringify({ THEME, LANG })); } catch (e) {} }
try { const s = JSON.parse(localStorage.getItem("buuz-mock") || "{}"); THEME = s.THEME || THEME; LANG = s.LANG || LANG; } catch (e) {}
const q = new URLSearchParams(location.search);
if (q.get("theme")) THEME = q.get("theme");
if (q.get("lang")) LANG = q.get("lang");
if (q.get("size")) { const [w, h] = q.get("size").split("x"); win.style.width = w + "px"; win.style.height = h + "px"; }
if (q.get("shot")) document.documentElement.classList.add("shot");
window.addEventListener("hashchange", render);
render();
</script>
<script>
// Layout check: open mockup.html?qa=1 (spec.md §4.2).
if (new URLSearchParams(location.search).get("qa")) (function(){
const out=[]; window.__H="home"; parse=function(){const [id,st]=window.__H.split("/"); const scr=SCREENS.find(s=>s.id===id)||SCREENS[0]; return {scr, st: scr.states.includes(st)?st:scr.states[0]};}; const sizes=[[1000,680],[880,600]]; const langs=["mn","en"];
const flat=[]; SCREENS.forEach(s=>s.states.forEach(st=>flat.push([s.id,st])));
const r=e=>e.getBoundingClientRect();
const skipAbs=e=>{const p=getComputedStyle(e).position; return p==="absolute"||p==="fixed";};
for(const [W,H] of sizes) for(const L of langs){
  LANG=L; win.style.width=W+"px"; win.style.height=H+"px";
  for(const [id,st] of flat){
    window.__H=id+"/"+st; try{render();}catch(err){out.push(`ERR ${W} ${L} ${id}/${st}: ${err.message}`);continue;} if(!win.querySelector(id.startsWith("t-")?".tour":".scroll")) out.push("NOSCREEN "+id);
    const tag=`${W}x${H} ${L} ${id}/${st}`;
    // sidebar must not clip
    const side=win.querySelector(".side"); if(side.scrollHeight>side.clientHeight+1) out.push(`${tag}: SIDEBAR clipped by ${side.scrollHeight-side.clientHeight}px`);
    // containers
    const conts=[...win.querySelectorAll(".panel,.sheet")].filter(c=>!(c.classList.contains("panel")&&win.querySelector(".sheet")));
    for(const c of conts){
      const cr=r(c);
      for(const e of c.querySelectorAll("*")){
        if(e.closest("svg")&&e.tagName!=="svg") continue;
        if(e.closest(".confetti")||e.closest(".hero")&&e.tagName==="IMG") continue;
        const er=r(e); if(er.width===0||er.height===0) continue;
        if(er.right>cr.right+0.5||er.left<cr.left-0.5) out.push(`${tag}: BLEED ${e.tagName}.${e.className} by ${Math.round(Math.max(er.right-cr.right,cr.left-er.left))}px`);
        const cs=getComputedStyle(e);
        if(e.scrollWidth>e.clientWidth+1 && cs.overflowX!=="visible" && cs.textOverflow!=="ellipsis" && !e.classList.contains("scroll") && !e.classList.contains("body") && e.tagName!=="svg") out.push(`${tag}: HCLIP ${e.tagName}.${e.className} ${e.scrollWidth}>${e.clientWidth}`);
        if(cs.textOverflow==="ellipsis" && e.scrollWidth>e.clientWidth+1) out.push(`${tag}: ELLIPSIS ${e.className} "${e.textContent.slice(0,40)}"`);
        // sibling overlap
        if(!skipAbs(e)){
          let s=e.nextElementSibling;
          while(s){ if(!skipAbs(s)&&s.tagName!=="svg"&&e.tagName!=="svg"){const sr=r(s); if(sr.width&&sr.height){const ix=Math.min(er.right,sr.right)-Math.max(er.left,sr.left), iy=Math.min(er.bottom,sr.bottom)-Math.max(er.top,sr.top); if(ix>2&&iy>2) out.push(`${tag}: OVERLAP ${e.tagName}.${e.className} x ${s.tagName}.${s.className}`);}} s=s.nextElementSibling;}
        }
        // narrow wrap: text blocks under 180px wide with 3+ lines
        if((e.tagName==="B"||e.tagName==="SPAN"||e.tagName==="P")&&e.children.length===0&&er.width<180){const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.45; if(er.height>lh*2.5) out.push(`${tag}: NARROWWRAP "${e.textContent.slice(0,40)}" w=${Math.round(er.width)}`);}
      }
    }
    // tour body: report if it needs scroll
    const body=win.querySelector(".tour .body"); if(body&&body.scrollHeight>body.clientHeight+1) out.push(`${tag}: TOURSCROLL ${body.scrollHeight-body.clientHeight}px`);
    const ss=win.querySelector(".sheet"); if(ss){const sr=r(ss), wr=r(win); if(sr.left<wr.left||sr.right>wr.right||sr.top<wr.top||sr.bottom>wr.bottom) out.push(`${tag}: SHEET outside window`);}
  }
}
const pre=document.createElement("pre"); pre.id="qa"; pre.textContent="QA-BEGIN\n"+out.join("\n")+"\nQA-END"; document.body.appendChild(pre);
})();
</script>
