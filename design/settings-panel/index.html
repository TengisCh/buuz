<!doctype html>

<!-- Settings panel mockups. Open with ?v=a|b|c|docs. Render: node design/settings-panel/render.js -->
<html lang="mn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings panel mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #ffffff; --card: #fffaf1; --fg: #1e1838; --muted: #6f5f55; --line: #f3e6d2; --press: #eedcc2;
  --sun: #ffd84d; --amber: #ffb648; --ember: #ff6a3d; --accent: #2e6bff; --link: #2254e0; --ember-text: #c2410c;
}
* { box-sizing: border-box; }
body { margin: 0; background: #e9e4dc; color: var(--fg); font: 700 15px/1.4 Nunito, system-ui, sans-serif; }
kbd, .ex { font-family: ui-monospace, Menlo, Consolas, monospace; }
.stage { display: flex; justify-content: center; align-items: flex-start; padding: 0; }

/* phone sheet */
.phone { width: 390px; min-height: 844px; background: rgba(30,24,56,.35); position: relative; overflow: hidden; }
.phone .under { position: absolute; inset: 0; padding: 18px; color: #fff; opacity: .5; font-size: 28px; font-weight: 900; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 44px; background: var(--bg); border-radius: 22px 22px 0 0; padding: 14px 16px 20px; overflow: hidden; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--press); margin: 0 auto 10px; }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.head h2 { margin: 0; font-size: 20px; font-weight: 900; }
.x { width: 34px; height: 34px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-size: 18px; color: var(--muted); }

.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 14px; padding: 4px; box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 6px; }
.seg span { text-align: center; padding: 8px 4px; border-radius: 11px; font-weight: 800; color: var(--muted); }
.seg .on { background: var(--sun); color: var(--fg); box-shadow: 0 2px 0 var(--sun-press, #e9a52f); }
.sub { color: var(--muted); font-size: 12.5px; text-align: center; margin: 0 0 12px; }

.group { background: var(--card); border-radius: 16px; box-shadow: inset 0 0 0 2px var(--line); margin-bottom: 12px; overflow: hidden; }
.glabel { font-size: 12px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 4px 4px 6px; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 2px solid var(--line); min-height: 48px; }
.row:first-child { border-top: 0; }
.ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; flex: none; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); }
.lbl { flex: 1; min-width: 0; }
.lbl b { display: block; font-weight: 800; font-size: 14.5px; line-height: 1.2; }
.lbl .ex { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 2px; white-space: nowrap; }
.info { color: var(--muted); font-size: 15px; width: 22px; text-align: center; }
.more { color: var(--muted); font-size: 20px; }
.count { color: var(--muted); font-weight: 800; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: #d9cfc2; position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.sw.on { background: var(--accent); }
.sw.on::after { left: 21px; }
.expand { padding: 0 12px 10px 52px; font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: -4px; }
.expand a { color: var(--link); }
.foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
.dim .lbl, .dim .ic { opacity: .45; }

/* B: tabs + tiles */
.tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.tabs span { flex: 1; text-align: center; padding: 8px 4px; border-radius: 12px; font-weight: 800; color: var(--muted); background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; }
.tabs .on { background: var(--fg); color: #fff; box-shadow: none; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { border-radius: 16px; padding: 10px 10px 9px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); position: relative; min-height: 92px; }
.tile.on { background: #fff4c7; box-shadow: inset 0 0 0 2px var(--amber); }
.tile .e { font-size: 22px; }
.tile b { display: block; font-size: 13.5px; font-weight: 800; line-height: 1.15; margin-top: 2px; }
.tile .ex { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.tile .dot { position: absolute; right: 9px; top: 9px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--press); font-size: 12px; display: grid; place-items: center; }
.tile.on .dot { background: var(--accent); color: #fff; box-shadow: none; }
.wide { grid-column: span 2; min-height: 0; display: flex; align-items: center; gap: 10px; }
.wide b { margin: 0; }

/* C + docs: desktop */
.desk { width: 1280px; min-height: 820px; background: var(--bg); padding: 28px 48px; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; }
.wm { font-size: 34px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
.wm img { width: 48px; height: 48px; }
.wm sup { font-size: 15px; color: var(--ember-text); }
.tg { display: flex; gap: 8px; }
.tg span { height: 40px; min-width: 40px; padding: 0 10px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); display: grid; place-items: center; font-weight: 800; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 22px; }
.field { border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 var(--press); min-height: 220px; padding: 16px 18px; font-size: 22px; }
.field.cyr { background: #fff4c7; box-shadow: inset 0 0 0 2px var(--amber), 0 4px 0 var(--sun-press, #e9a52f); }
.fhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 17px; background: #fff; box-shadow: inset 0 0 0 2px var(--line); font-size: 14px; font-weight: 800; white-space: nowrap; }
.chip.on { background: #fff4c7; box-shadow: inset 0 0 0 2px var(--amber); }
.chip.off { color: var(--muted); }
.chip.dark { background: var(--fg); color: #fff; box-shadow: none; }
.chips { display: flex; flex-wrap: nowrap; gap: 6px; margin-top: 12px; }
.btn { display: inline-block; margin-top: 10px; background: var(--accent); color: #fff; border-radius: 14px; padding: 9px 18px; font-weight: 900; }
.pop { position: absolute; width: 340px; background: #fff; border-radius: 18px; box-shadow: 0 0 0 2px var(--line), 0 18px 40px rgba(30,24,56,.18); padding: 10px; }
.pop .row { border-top: 2px solid var(--line); }
.callout { position: absolute; background: var(--fg); color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 10px; font-weight: 800; }

/* docs */
.dsheet { position: absolute; top: 70px; left: 120px; right: 120px; background: #fff; border-radius: 24px; box-shadow: 0 0 0 2px var(--line), 0 24px 60px rgba(30,24,56,.25); padding: 22px 26px; }
.dshade { position: absolute; inset: 0; background: rgba(30,24,56,.35); }
.schemes { display: flex; gap: 8px; margin: 8px 0 6px; }
.desc { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
.kb { display: grid; gap: 6px; }
.kr { display: flex; gap: 6px; }
.k { width: 62px; height: 62px; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--press); position: relative; }
.k i { position: absolute; left: 7px; top: 4px; font-style: normal; font-size: 13px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
.k em { position: absolute; right: 8px; bottom: 4px; font-style: normal; font-size: 24px; font-weight: 900; }
.k.h { background: #fff4c7; box-shadow: inset 0 0 0 2px var(--amber), 0 3px 0 #e9a52f; }
.k.ghost { visibility: hidden; }
.combos { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.combo { padding: 5px 10px; border-radius: 10px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); font-size: 15px; }
.combo kbd { font-weight: 700; color: var(--muted); }
.combo.s { background: #eef3ff; box-shadow: inset 0 0 0 2px #c9d8ff; }
.legend { display: flex; gap: 18px; font-size: 13px; color: var(--muted); margin-top: 12px; }
.sw-sq { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const v = new URLSearchParams(location.search).get("v") || "a";
const S = document.getElementById("stage");
const sw = (on) => `<span class="sw ${on ? "on" : ""}"></span>`;

const features = [
  ["🎵", "Эгшиг зохицох", "unee → үнээ", true],
  ["✂️", "Товчлол", "bn → байна", true],
  ["⇥", "Tab-аар үг гүйцээх", "сайх ⇥ → сайхан", true],
  ["🥛", "vv → үү", "svv → сүү", true],
  ["🔡", "ts → ц, zh → ж", "tsagaan → цагаан", true],
  ["📚", "ө, ү-г үгээр таах", "tov → төв", true],
  ["🩹", "Алдаа засах", "delgur → дэлгүүр", false],
];

if (v === "a") {
  S.innerHTML = `<div class="phone"><div class="under">Buuz 2.0</div><div class="sheet">
    <div class="grab"></div>
    <div class="head"><h2>⚙️ Тохиргоо</h2><span class="x">✕</span></div>
    <div class="seg"><span class="on">✨ Ухаалаг</span><span>🕰️ Сонгодог</span></div>
    <p class="sub">Сонгодог = анхны Buuz, нэмэлтгүй</p>
    <div class="group">${features.map(([e, l, x, on], i) => `
      <div class="row"><span class="ic">${e}</span><span class="lbl"><b>${l}</b><span class="ex">${x}</span></span><span class="info">ⓘ</span>${sw(on)}</div>
      ${i === 1 ? `<div class="expand">Үгийн дараа зай дарахад бүтэн үг болно. Зайгаа арилгавал буцна.</div>` : ""}`).join("")}
    </div>
    <div class="group">
      <div class="row"><span class="ic">🎯</span><span class="lbl"><b>Бичих хэвээ заах</b></span><span class="more">›</span></div>
      <div class="row"><span class="ic">📒</span><span class="lbl"><b>Миний үгс</b></span><span class="count">12</span><span class="more">›</span></div>
      <div class="row"><span class="ic">📖</span><span class="lbl"><b>Бүх дүрэм, хүснэгт</b></span><span class="more">›</span></div>
    </div>
    <p class="foot">🔒 Бүгд зөвхөн таны төхөөрөмж дээр</p>
  </div></div>`;
}

if (v === "b") {
  S.innerHTML = `<div class="phone"><div class="under">Buuz 2.0</div><div class="sheet">
    <div class="grab"></div>
    <div class="head"><h2>⚙️ Тохиргоо</h2><span class="x">✕</span></div>
    <div class="tabs"><span class="on">✨ Бичих</span><span>📒 Үгс · 12</span><span>📖 Дүрэм</span></div>
    <div class="seg"><span class="on">✨ Ухаалаг</span><span>🕰️ Сонгодог</span></div>
    <p class="sub">Хавтан дээр дарж асаана, унтраана</p>
    <div class="tiles">
      ${features.map(([e, l, x, on]) => `<div class="tile ${on ? "on" : ""}"><span class="dot">${on ? "✓" : ""}</span><span class="e">${e}</span><b>${l}</b><span class="ex">${x}</span></div>`).join("")}
      <div class="tile"><span class="e">🎯</span><b>Бичих хэвээ заах</b><span class="ex">1 минут ›</span></div>
    </div>
    <p class="foot" style="margin-top:12px">🔒 Бүгд зөвхөн таны төхөөрөмж дээр</p>
  </div></div>`;
}

if (v === "c") {
  S.innerHTML = `<div class="desk">
    <div class="top"><div class="wm"><img src="../../brand/icons/buuz-buddy-icon.svg" alt="">Buuz<sup>2.0</sup></div>
      <div class="tg"><span>⚙️</span><span>🌙</span><span>🇲🇳 МОН ▾</span></div></div>
    <div class="cols">
      <div>
        <div class="fhead"><span class="chip dark">🇲🇳 Монгол ▾</span><span class="chip">📖 Хүснэгт</span></div>
        <div class="field">sain baina uu, bn</div>
        <div class="chips">
          <span class="chip on">✨ Ухаалаг</span>
          <span class="chip on">✂️ bn→байна</span>
          <span class="chip on">⇥ Tab</span>
          <span class="chip on">📚 ө/ү таах</span>
          <span class="chip off">🩹 Засах</span>
          <span class="chip">⋯</span>
        </div>
      </div>
      <div>
        <div class="fhead"><span class="chip" style="visibility:hidden">.</span></div>
        <div class="field cyr">сайн байна уу, байна</div>
        <span class="btn">📋 Хуулах</span>
      </div>
    </div>
    <div class="pop" style="left:420px; top:400px">
      <div class="row" style="border-top:0"><span class="ic">🎵</span><span class="lbl"><b>Эгшиг зохицох</b><span class="ex">unee → үнээ</span></span>${sw(true)}</div>
      <div class="row"><span class="ic">🥛</span><span class="lbl"><b>vv → үү</b><span class="ex">svv → сүү</span></span>${sw(true)}</div>
      <div class="row"><span class="ic">🔡</span><span class="lbl"><b>ts → ц, zh → ж</b><span class="ex">tsagaan → цагаан</span></span>${sw(true)}</div>
      <div class="row"><span class="ic">🎯</span><span class="lbl"><b>Бичих хэвээ заах</b></span><span class="more">›</span></div>
      <div class="row"><span class="ic">📒</span><span class="lbl"><b>Миний үгс</b></span><span class="count">12</span><span class="more">›</span></div>
    </div>
    <div class="callout" style="left:330px; top:84px">① Бичих хэл талбар дээрээ</div>
    <div class="callout" style="left:48px; top:345px">② Гол тохиргоо чип болж, нэг товшилтоор</div>
    <div class="callout" style="left:780px; top:420px">③ Үлдсэн нь ⋯ дотор</div>
  </div>`;
}

if (v === "docs") {
  const rows = [
    [["q","ө",1],["w","ү",1],["e","э"],["r","р"],["t","т"],["y","ы"],["u","у/ү",1],["i","и"],["o","о/ө",1],["p","п"]],
    [["a","а"],["s","с"],["d","д"],["f","ф"],["g","г"],["h","х"],["j","ж"],["k","к"],["l","л"],["'","ь"]],
    [["z","з"],["x","х"],["c","ц"],["v","в"],["b","б"],["n","н"],["m","м"],['"',"ъ"]],
  ];
  const combos = [["sh","ш"],["ch","ч"],["kh","х"],["ya","я"],["ye","е"],["yo","ё"],["yu","ю"],["ii","ий/ы"],["ii'","ий"],["iii","ы"],["sxc","щ"]];
  const smart = [["vv","үү"],["ts","ц"],["zh","ж"],["ö","ө"],["ü","ү"]];
  S.innerHTML = `<div class="desk"><div class="top"><div class="wm"><img src="../../brand/icons/buuz-buddy-icon.svg" alt="">Buuz<sup>2.0</sup></div></div>
    <div class="dshade"></div>
    <div class="dsheet">
      <div class="head"><h2>📖 Бичих дүрэм</h2><span class="x">✕</span></div>
      <div class="schemes"><span class="chip dark">🇲🇳 Buuz · чат шиг</span><span class="chip">🪪 MNS 5217 · паспорт</span><span class="chip">🇷🇺 Русский ▾</span></div>
      <p class="desc">Ихэнх хүн чатад ингэж бичдэг. o, u нь үгээсээ хамаарч о/ө, у/ү болно.</p>
      <div class="kb">${rows.map((r, i) => `<div class="kr" style="padding-left:${i * 22}px">${r.map(([l, c, h]) => `<div class="k ${h ? "h" : ""}"><i>${l}</i><em>${c}</em></div>`).join("")}</div>`).join("")}</div>
      <div class="combos">${combos.map(([l, c]) => `<span class="combo"><kbd>${l}</kbd> ${c}</span>`).join("")}</div>
      <div class="combos">${smart.map(([l, c]) => `<span class="combo s"><kbd>${l}</kbd> ${c}</span>`).join("")}</div>
      <div class="legend"><span><span class="sw-sq" style="background:#fff4c7;box-shadow:inset 0 0 0 2px #ffb648"></span>Эгшиг</span><span><span class="sw-sq" style="background:#eef3ff;box-shadow:inset 0 0 0 2px #c9d8ff"></span>✨ Ухаалаг горимд</span><span>📄 Бүрэн хүснэгт: docs/typing-rules</span></div>
    </div></div>`;
}
</script>
</body>
</html>
