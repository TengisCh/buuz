name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like Buuz to do?
      description: Describe the problem or the moment where Buuz could help. Mongolian or English are both fine.
      placeholder: "When I type bn I want it to become байна automatically."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A short sketch of what you would press and what you would see.
  - type: dropdown
    id: platform
    attributes:
      label: Where
      multiple: true
      options: [Windows, macOS, Web converter, Android, iOS, All]
  - type: textarea
    id: other
    attributes:
      label: Other apps that do this well
      description: Optional. Another keyboard or input method (any language) that already has this.
