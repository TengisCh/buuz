name: docs

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", "tools/lint/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", "tools/lint/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/lint/package-lock.json
      - run: npm ci
      - name: Markdown lint
        run: tools/lint/node_modules/.bin/markdownlint-cli2
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Mermaid diagrams parse
        run: node check-mermaid.mjs
