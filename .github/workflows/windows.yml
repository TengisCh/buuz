name: windows

# The Windows input method. It runs only when windows/, ffi/ or the core
# changes. Each CPU type builds and tests on its own free runner: x64 on
# windows-latest, ARM64 on windows-11-arm (free for public repositories).
on:
  push:
    branches: [main]
    paths: ["windows/**", "ffi/**", "core/src/**", "core/Cargo.toml", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "ffi/**", "core/src/**", "core/Cargo.toml", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pure shell logic (key map, UTF-8 to UTF-16, engine over buuz-ffi)
  # builds and runs on Linux with gcc. It is fast and gates the Windows build.
  logic-linux:
    name: logic tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ffi
          key: linux-logic
      - name: Build buuz-ffi
        working-directory: ffi
        run: cargo build --locked
      - name: Configure
        run: cmake -S windows -B windows/build -DBUUZ_FFI_LIB=$PWD/ffi/target/debug/libbuuz_ffi.a
      - name: Build
        run: cmake --build windows/build
      - name: Run the shell logic tests
        run: ctest --test-dir windows/build --output-on-failure

  build:
    name: build (${{ matrix.arch }})
    needs: logic-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: windows-latest, cmake_arch: x64 }
          - { arch: arm64, os: windows-11-arm, cmake_arch: ARM64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ffi
          key: ${{ matrix.arch }}
      - name: Build buuz-ffi (release, static C runtime)
        working-directory: ffi
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked
      - name: Configure
        run: cmake -S windows -B windows/build -A ${{ matrix.cmake_arch }}
      - name: Build the DLL and the tests
        run: cmake --build windows/build --config Release
      - name: Run the shell logic tests
        run: ctest --test-dir windows/build -C Release --output-on-failure
      - name: Check the DLL
        shell: pwsh
        run: |
          $dll = "windows/build/Release/buuz_tsf.dll"
          if (-not (Test-Path $dll)) { throw "buuz_tsf.dll missing" }
          if (-not (Test-Path "windows/build/Release/buuz_settings.exe")) { throw "buuz_settings.exe missing" }
          "{0:N0} KB" -f ((Get-Item $dll).Length / 1KB)
      - name: Register the text service
        shell: pwsh
        run: |
          $dll = (Resolve-Path "windows/build/Release/buuz_tsf.dll").Path
          # regsvr32 is a GUI program: wait for it and read its exit code.
          $p = Start-Process regsvr32 -ArgumentList "/s", "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "regsvr32 failed: $($p.ExitCode)" }
          if (-not (Test-Path "HKLM:\SOFTWARE\Classes\CLSID\{5E0B7A2C-9D41-4C7E-8B1A-3F6D2A9C4E10}\InprocServer32")) { throw "CLSID not registered" }
      # Types `sain baina` with real key events into a real Rich Edit control
      # and reads the text back. It runs on the runner's interactive desktop.
      # It passed on x64 on its first run, so x64 blocks the build. ARM64 does
      # not block until it has passed too (see README).
      - name: End-to-end typing test
        timeout-minutes: 4
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          Start-Process ctfmon.exe
          Start-Sleep -Seconds 3
          & windows/build/Release/e2e_typing.exe
          exit $LASTEXITCODE
      - name: Unregister the text service
        if: always()
        shell: pwsh
        run: |
          $dll = (Resolve-Path "windows/build/Release/buuz_tsf.dll").Path
          $p = Start-Process regsvr32 -ArgumentList "/s", "/u", "`"$dll`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "unregister failed: $($p.ExitCode)" }
      # ARM64X (ARM64 only): one buuz_tsf.dll that ARM64 and emulated x64 apps
      # both load. It forwards to the ARM64 DLL or to an x64 DLL built here.
      # Not blocking until it has passed on CI once.
      - name: Build the x64 DLL (ARM64X)
        id: x64dll
        if: matrix.arch == 'arm64'
        continue-on-error: true
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --locked --target x86_64-pc-windows-msvc --manifest-path ffi/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "cargo failed" }
          $lib = (Resolve-Path "ffi/target/x86_64-pc-windows-msvc/release/buuz_ffi.lib").Path
          cmake -S windows -B windows/build-x64 -A x64 "-DBUUZ_FFI_LIB=$lib" -DBUUZ_DLL_SUFFIX=_x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build windows/build-x64 --config Release --target buuz_tsf
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
      - name: Build the ARM64X forwarder
        id: arm64x
        if: matrix.arch == 'arm64' && steps.x64dll.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh windows/arm64x/build.ps1 `
            -Arm64Dll windows/build/Release/buuz_tsf.dll `
            -X64Dll windows/build-x64/Release/buuz_tsf_x64.dll `
            -Settings windows/build/Release/buuz_settings.exe `
            -Out windows/dist-arm64x
          if ($LASTEXITCODE -ne 0) { throw "forwarder failed" }
      # The installer needs Inno Setup. The runner image may carry it; if not,
      # install a pinned version from the Chocolatey package. This is a build
      # tool only: nothing from it goes into the DLL or the app.
      - name: Build the installer
        id: installer
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          function Find-Iscc {
            foreach ($d in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              $c = Join-Path $d "Inno Setup 6\ISCC.exe"
              if (Test-Path $c) { return $c }
            }
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --version=6.4.3 --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          $src = (Resolve-Path "windows/build/Release").Path
          $extra = @()
          if ("${{ steps.arm64x.outcome }}" -eq "success") {
            # The ARM64 installer carries the forwarder and both DLLs.
            $src = (Resolve-Path "windows/dist-arm64x").Path
            $extra = @("/DArm64x=1")
          }
          & $iscc /Q "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" @extra windows/installer/buuz.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem windows/installer/output
      # Silent install, check the registration, silent uninstall, check again.
      - name: Test the installer
        if: steps.installer.outcome == 'success'
        continue-on-error: ${{ matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem windows/installer/output/Buuz-*.exe | Select-Object -First 1).FullName
          $key = "HKLM:\SOFTWARE\Classes\CLSID\{5E0B7A2C-9D41-4C7E-8B1A-3F6D2A9C4E10}\InprocServer32"
          $p = Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          if (-not (Test-Path $key)) { throw "CLSID not registered after install" }
          $dir = Join-Path $env:ProgramFiles "Buuz"
          $registered = (Get-Item $key).GetValue("")
          if ($registered -ne (Join-Path $dir "buuz_tsf.dll")) { throw "registered path is $registered" }
          foreach ($f in "buuz_tsf.dll", "buuz_settings.exe", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "$f missing after install" }
          }
          $u = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall failed: $($u.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path $key) { throw "CLSID still registered after uninstall" }
          "install and uninstall ok"
      - name: Collect the test files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/dist/${{ matrix.arch }} | Out-Null
          Copy-Item windows/build/Release/buuz_tsf.dll, windows/build/Release/buuz_settings.exe, windows/build/Release/e2e_typing.exe windows/dist/${{ matrix.arch }}/
          Copy-Item windows/installer/output/Buuz-*.exe windows/dist/${{ matrix.arch }}/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: buuz-windows-${{ matrix.arch }}
          path: windows/dist
          retention-days: 14
