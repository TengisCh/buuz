name: core

# Kept cheap on purpose: Linux only on push/PR, and only when core/ changes.
# The Windows + macOS matrix runs on release tags or when started by hand
# (Actions tab → core → Run workflow).
on:
  push:
    branches: [main]
    paths: ["core/**", "data/wordlist/**", "data/benchmark/**", ".github/workflows/core.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["core/**", "data/wordlist/**", "data/benchmark/**", ".github/workflows/core.yml"]
  workflow_dispatch:

# Read-only token. Actions are pinned to full commit SHAs (Dependabot bumps them).
permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Speed budgets (the release build checks them)
        run: cargo test --release --locked
      - name: Docs build without warnings (broken intra-doc links, bad doc tests)
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
