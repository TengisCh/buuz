name: ffi

# The C ABI for the desktop shells. Linux only on push/PR, and only when
# ffi/ or the core changes. The Windows + macOS matrix runs on release tags
# or when started by hand (Actions tab → ffi → Run workflow).
on:
  push:
    branches: [main]
    paths: ["ffi/**", "core/src/**", "core/Cargo.toml", ".github/workflows/ffi.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["ffi/**", "core/src/**", "core/Cargo.toml", ".github/workflows/ffi.yml"]
  workflow_dispatch:

# Read-only token. Actions are pinned to full commit SHAs (Dependabot bumps them).
permissions:
  contents: read

concurrency:
  group: ffi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ffi
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ffi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: C smoke test against the static library
        if: runner.os != 'Windows'
        run: |
          libs="-lpthread -lm"
          if [ "$RUNNER_OS" = "Linux" ]; then libs="$libs -ldl"; fi
          cc -std=c11 -Wall -Wextra -Werror -Iinclude tests/smoke.c target/debug/libbuuz_ffi.a $libs -o target/smoke
          ./target/smoke
      - name: The header compiles as C++
        if: runner.os != 'Windows'
        run: c++ -x c++ -std=c++17 -Wall -Werror -fsyntax-only -Iinclude include/buuz.h
