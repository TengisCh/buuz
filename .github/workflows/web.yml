name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "core/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "core/**", ".github/workflows/web.yml"]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/site/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/wasm
      - run: npm ci
      - run: npm run build
      - run: npm test
